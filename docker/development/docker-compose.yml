services:
  React.Typescript.Vite:
    build:
      context: ../../
      dockerfile: docker/development/Dockerfile
    image: react.typescript.vite.development
    ports:
      - '3000:3000'
    # Hot reload: mount the source, keep the container's node_modules
    volumes:
      - ../../:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
