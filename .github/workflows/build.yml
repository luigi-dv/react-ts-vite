name: Build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Quality gate (typecheck · lint · format · arch:check · agent:check · tests)
        run: npm run check
      - name: Build
        run: npm run build

  architectures:
    name: Architecture switch smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply every architecture with all templates and verify it
        run: |
          set -euo pipefail
          node bin/rtv.mjs templates add landing dashboard auth blank not-found --remove-example --quiet
          for arch in feature fsd clean atomic classic; do
            echo "::group::$arch"
            node bin/rtv.mjs arch apply "$arch" --yes --quiet
            node bin/rtv.mjs arch check
            npm run typecheck
            npm run test:run -- --reporter=dot
            echo "::endgroup::"
          done
